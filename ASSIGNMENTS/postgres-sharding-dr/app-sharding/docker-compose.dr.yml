# Disaster recovery on top of docker-compose.yml:
# WAL archiving to the backup site + async streaming replica for every shard.

services:
  shard0:
    command:
      - postgres
      - -c
      - wal_log_hints=on
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /backup/shard0/wal/%f.gz && gzip -c %p > /backup/shard0/wal/%f.gz
    volumes:
      - backup_site:/backup

  shard1:
    command:
      - postgres
      - -c
      - wal_log_hints=on
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /backup/shard1/wal/%f.gz && gzip -c %p > /backup/shard1/wal/%f.gz
    volumes:
      - backup_site:/backup

  pgbouncer0:
    environment:
      DB_HOST: ${SHARD0_HOST:-shard0}

  pgbouncer1:
    environment:
      DB_HOST: ${SHARD1_HOST:-shard1}

  shard0_replica:
    image: postgres:17
    container_name: app_shard0_replica
    user: postgres
    volumes:
      - shard0_replica_data:/var/lib/postgresql/data
      - backup_site:/backup
    command:
      - bash
      - -c
      - |
        [ -s "$$PGDATA/PG_VERSION" ] || pg_basebackup -h shard0 -U movies_admin -D "$$PGDATA" -R -X stream
        chmod 700 "$$PGDATA"
        exec postgres -c wal_log_hints=on -c archive_mode=on -c archive_timeout=300 -c 'archive_command=test ! -f /backup/shard0/wal/%f.gz && gzip -c %p > /backup/shard0/wal/%f.gz'
    depends_on:
      - shard0

  shard1_replica:
    image: postgres:17
    container_name: app_shard1_replica
    user: postgres
    volumes:
      - shard1_replica_data:/var/lib/postgresql/data
      - backup_site:/backup
    command:
      - bash
      - -c
      - |
        [ -s "$$PGDATA/PG_VERSION" ] || pg_basebackup -h shard1 -U movies_admin -D "$$PGDATA" -R -X stream
        chmod 700 "$$PGDATA"
        exec postgres -c wal_log_hints=on -c archive_mode=on -c archive_timeout=300 -c 'archive_command=test ! -f /backup/shard1/wal/%f.gz && gzip -c %p > /backup/shard1/wal/%f.gz'
    depends_on:
      - shard1

volumes:
  shard0_replica_data:
  shard1_replica_data:
  backup_site:
    name: dr_backup_site
    external: true
