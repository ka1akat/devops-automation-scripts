services:
  shard0:
    image: postgres:17
    container_name: app_shard0
    environment:
      POSTGRES_USER: movies_admin
      POSTGRES_PASSWORD: movies_pass
      POSTGRES_DB: movies
    volumes:
      - shard0_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../common/sql/V3__add_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ../common/sql/V4__optimize_recommendation_functions.sql:/docker-entrypoint-initdb.d/03_functions.sql:ro

  shard1:
    image: postgres:17
    container_name: app_shard1
    environment:
      POSTGRES_USER: movies_admin
      POSTGRES_PASSWORD: movies_pass
      POSTGRES_DB: movies
    volumes:
      - shard1_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../common/sql/V3__add_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ../common/sql/V4__optimize_recommendation_functions.sql:/docker-entrypoint-initdb.d/03_functions.sql:ro

  pgbouncer0:
    image: edoburu/pgbouncer
    container_name: app_pgbouncer0
    environment:
      DB_HOST: shard0
      DB_PORT: 5432
      DB_USER: movies_admin
      DB_PASSWORD: movies_pass
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6441:5432"
    depends_on:
      - shard0

  pgbouncer1:
    image: edoburu/pgbouncer
    container_name: app_pgbouncer1
    environment:
      DB_HOST: shard1
      DB_PORT: 5432
      DB_USER: movies_admin
      DB_PASSWORD: movies_pass
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6442:5432"
    depends_on:
      - shard1

  api:
    build: ../api
    container_name: app_api
    network_mode: host
    environment:
      MODE: app
      PORT: 8002
      DSNS: postgresql://movies_admin:movies_pass@127.0.0.1:6441/movies,postgresql://movies_admin:movies_pass@127.0.0.1:6442/movies
    depends_on:
      - pgbouncer0
      - pgbouncer1

volumes:
  shard0_data:
  shard1_data:
